<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Honeycomb icon -->
  <g transform="translate(4, 4)">
    <!-- Center hexagon -->
    <polygon points="26,0 52,15 52,45 26,52 0,45 0,15" fill="#C8962E" opacity="0.9"/>
    <!-- Inner hex detail -->
    <polygon points="26,8 44,19 44,39 26,44 8,39 8,19" fill="#DEBA5C" opacity="0.5"/>
    <!-- Bee body -->
    <ellipse cx="26" cy="26" rx="8" ry="6" fill="#2D2D2D"/>
    <line x1="20" y1="24" x2="32" y2="24" stroke="#C8962E" stroke-width="1.5"/>
    <line x1="19" y1="27" x2="33" y2="27" stroke="#C8962E" stroke-width="1.5"/>
    <!-- Wings -->
    <ellipse cx="21" cy="20" rx="5" ry="3.5" fill="#DEBA5C" opacity="0.6" transform="rotate(-20 21 20)"/>
    <ellipse cx="31" cy="20" rx="5" ry="3.5" fill="#DEBA5C" opacity="0.6" transform="rotate(20 31 20)"/>
  </g>
  <!-- Text -->
  <text x="68" y="28" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="700" fill="#2D2D2D">All In Hive</text>
  <text x="68" y="48" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="400" fill="#C8962E" letter-spacing="3">PURE BEE PRODUCTS</text>
</svg>
